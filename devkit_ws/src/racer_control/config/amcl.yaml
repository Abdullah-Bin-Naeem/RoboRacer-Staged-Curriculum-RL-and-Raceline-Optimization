# AMCL against the SLAM map, using only race-legal sensors.
#
# Frames:  map -> odom -> roboracer_1 -> lidar
#          AMCL publishes map->odom; racer_control/dead_reckoning publishes
#          odom->roboracer_1; a static publisher supplies roboracer_1->lidar.
#
# The devkit's own world->roboracer_1 is ground truth and must be remapped out
# of /tf (see localization.launch.py), or roboracer_1 ends up with two parents
# and the TF tree breaks.

amcl:
  ros__parameters:
    use_sim_time: false

    base_frame_id: roboracer_1        # devkit's vehicle frame, at the rear axle
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /autodrive/roboracer_1/lidar

    # ---- Motion model ----
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # Deliberately loose. The encoders overread up to ~3x under hard
    # acceleration (wheel slip, measured during the RL work), so the odometry
    # this filter is fed can be badly wrong for short bursts. Tight alphas make
    # the filter overconfident in a wrong prediction and it diverges.
    alpha1: 0.30      # rotation noise from rotation
    alpha2: 0.30      # rotation noise from translation
    alpha3: 0.50      # translation noise from translation  <- slip lives here
    alpha4: 0.30      # translation noise from rotation
    alpha5: 0.20      # strafe (unused by the differential model)

    # ---- Laser model ----
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.10
    laser_max_range: 9.50             # matches the mapping run
    max_beams: 180                    # subsampled from the devkit's 1080
    # Weights must sum to 1. z_hit dominates because the sim's lidar is clean;
    # z_rand guards against the unknown infield returning nothing useful.
    z_hit: 0.60
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.30
    sigma_hit: 0.10
    lambda_short: 0.10

    # ---- Particles ----
    min_particles: 500
    # Global localization has to cover ~47 m^2 of free space from scratch, which
    # 2000 particles spreads too thinly. It prunes back down within a few metres.
    max_particles: 8000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.001        # non-zero: allows recovery if it gets lost
    recovery_alpha_fast: 0.10
    resample_interval: 1

    # ---- Update triggers ----
    # A race car covers ground fast; updating only every 0.2 m (the nav2
    # default) means long gaps between corrections at 8 m/s.
    update_min_d: 0.10                # metres of travel before an update
    update_min_a: 0.10                # radians of rotation before an update
    transform_tolerance: 0.5
    save_pose_rate: 2.0
    always_reset_initial_pose: false
    set_initial_pose: true
    tf_broadcast: true

    # Overridden by the launch file. The SLAM map was built with scan matching
    # off against ground-truth odometry, so map coordinates line up with the
    # simulator's world frame -- the car's spawn pose works as-is.
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""                 # set by the launch file
    topic_name: "map"
    frame_id: "map"
