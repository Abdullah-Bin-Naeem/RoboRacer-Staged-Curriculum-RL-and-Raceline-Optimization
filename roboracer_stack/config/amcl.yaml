# AMCL against the SLAM map, using only race-legal sensors.
#
# Frames:  map -> odom -> roboracer_1 -> lidar
#          AMCL publishes map->odom; localization/dead_reckoning publishes
#          odom->roboracer_1; a static publisher supplies roboracer_1->lidar.
#
# The devkit's own world->roboracer_1 is ground truth and must be remapped out
# of /tf (see localization.launch.py), or roboracer_1 ends up with two parents
# and the TF tree breaks.

amcl:
  ros__parameters:
    use_sim_time: false

    base_frame_id: roboracer_1        # devkit's vehicle frame, at the rear axle
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /autodrive/roboracer_1/lidar

    # ---- Motion model ----
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # DERIVED FROM THE VEHICLE SPEC, not guessed. nav2 draws the motion noise as
    #   sigma_trans = sqrt(alpha3*d_trans^2 + alpha4*(d_rot1^2 + d_rot2^2))
    #   sigma_rot1  = sqrt(alpha1*d_rot1^2  + alpha2*d_trans^2)
    # so sqrt(alpha) is a FRACTIONAL error, not an absolute one.
    #
    # At 8 m/s and 18 Hz one update is d_trans = 0.44 m. The previous values
    # (0.30/0.30/0.50/0.30) therefore injected sigma_trans = 0.31 m and
    # sigma_rot = 13.8 deg on EVERY update -- against a 0.134 m wall margin.
    # The filter scattered particles far wider than physics allows and the
    # sensor model had to drag them back, which with resample_interval: 1
    # leaves few effective particles and a jittery mean.
    #
    # What the published vehicle spec actually allows:
    #   longitudinal tire extremum slip = 0.15  -> encoders overread <=15%
    #     15% -> alpha3 0.022; allow 30% for wheelspin transients -> 0.09
    #   measured sideslip = 2.9 deg (velocity vs body x-axis)
    #     0.051 rad over 0.44 m -> alpha2 0.013; 2x margin -> 0.05
    #   heading is ABSOLUTE (IMU quaternion) and does not drift, so alpha1 only
    #     has to cover the rot1/rot2 decomposition -> 0.05
    #
    # The 1.55% steady-state bias these used to absorb is gone: dead_reckoning
    # now uses the measured 0.0581 m effective rolling radius, not the spec's
    # geometric 0.0590. Restore 0.30/0.30/0.50/0.30 to A/B against the old set.
    alpha1: 0.05      # rotation noise from rotation
    alpha2: 0.05      # rotation noise from translation
    alpha3: 0.10      # translation noise from translation  <- slip lives here
    alpha4: 0.05      # translation noise from rotation
    alpha5: 0.20      # strafe (unused by the differential model)

    # ---- Laser model ----
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.10
    laser_max_range: 9.50             # just inside the sim lidar's 10 m range_max
    max_beams: 180                    # subsampled from the devkit's 1080
    # Weights must sum to 1. z_hit dominates because the sim's lidar is clean;
    # z_rand guards against the unknown infield returning nothing useful.
    z_hit: 0.60
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.30
    sigma_hit: 0.10
    lambda_short: 0.10

    # ---- Particles ----
    min_particles: 500
    # Global localization has to cover ~66 m^2 of free space (track_clean,
    # compete track) from scratch, which 2000 particles spreads too thinly. It
    # prunes back down within a few metres. The respawn re-seed also draws the
    # full set, spread along the matching stretch of line.
    max_particles: 8000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.001        # non-zero: allows recovery if it gets lost
    recovery_alpha_fast: 0.10
    resample_interval: 1

    # ---- Update triggers ----
    # A race car covers ground fast; updating only every 0.2 m (the nav2
    # default) means long gaps between corrections at 8 m/s.
    update_min_d: 0.10                # metres of travel before an update
    update_min_a: 0.10                # radians of rotation before an update
    transform_tolerance: 0.5
    save_pose_rate: 2.0
    always_reset_initial_pose: false
    set_initial_pose: true
    tf_broadcast: true

    # Overridden by amcl.launch.py from roboracer_stack.common.frames.SPAWN_*;
    # this is the standalone fallback, used only when the bootstrap seed never
    # lands. The SLAM map was built with scan matching off against ground-truth
    # odometry, so map coordinates equal the simulator's world frame and a
    # world-frame pose can be used verbatim.
    # The MEASURED spawn on 2026-iros-compete (2026-09-15). Keep in step with
    # frames.py.
    initial_pose:
      x: 0.818
      y: 3.158
      z: 0.0
      yaw: -1.5707

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""                 # set by the launch file
    topic_name: "map"
    frame_id: "map"
