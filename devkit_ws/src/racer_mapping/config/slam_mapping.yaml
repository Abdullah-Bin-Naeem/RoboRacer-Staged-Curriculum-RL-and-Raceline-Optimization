# slam_toolbox async mapping config for the AutoDRIVE RoboRacer.
#
# Frame plumbing: the devkit broadcasts world -> roboracer_1 -> lidar, with no
# map or odom frame. Rather than renaming devkit frames, slam_toolbox is pointed
# straight at them: it treats "world" as the odom frame and publishes map ->
# world on top. Nothing in autodrive_devkit has to change.
#
# The simulator's world -> roboracer_1 transform comes from the IPS and is
# ground truth, so it does not drift. That is why scan matching and loop closure
# are off below -- see the notes on those keys.

slam_toolbox:
  ros__parameters:

    # ---- Plugins ----
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ---- Frames and topics ----
    odom_frame: world           # devkit's ground-truth parent frame
    map_frame: map
    base_frame: roboracer_1     # devkit's vehicle frame (center of rear axle)
    scan_topic: /autodrive/roboracer_1/lidar
    mode: mapping

    # The devkit stamps messages with the wall clock and publishes no /clock.
    use_sim_time: false

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 0.5    # Lower than default: faster feedback while driving
    enable_interactive_mode: true

    # ---- Map geometry ----
    # 0.05 m/cell is the standard tradeoff. Drop to 0.025 for a crisper map to
    # optimize a raceline against; the file gets 4x bigger and SLAM runs slower.
    resolution: 0.05

    # The devkit LIDAR maxes out at 10.0 m. Readings at or beyond this value are
    # traced as free space rather than marked as obstacles, so max-range "no
    # return" rays do not become a ring of phantom walls.
    max_laser_range: 9.5

    minimum_time_interval: 0.1
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # ---- When a new scan gets added to the map ----
    # Defaults (0.5 m / 0.5 rad) are tuned for room-scale robots and leave gaps
    # on a tight track. These add a keyframe every 10 cm or ~6 degrees, which
    # densely covers the walls at the cost of a larger pose graph.
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1

    # ---- Scan matching and loop closure ----
    # Both OFF on purpose. Odometry here is simulator ground truth, so there is
    # no drift to correct. A race track is a long feature-poor corridor, exactly
    # the geometry where scan matching slides scans along the walls and loop
    # closure warps an already-correct map. Trusting odom gives a cleaner result.
    #
    # If you ever map from noisy/real odometry, flip both to true and the
    # parameters below become live.
    use_scan_matching: false
    use_scan_barycenter: true
    do_loop_closing: false

    scan_buffer_size: 30
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
